<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#e0e8ff] font-[Red_Hat_Display] text-center text-[#1f2f56] m-0 mt-0">
  <img class="hidden md:block absolute top-0 left-0 w-full z-0" src="./pattern-background-desktop.svg" alt="">
  <img class=" block md:hidden absolute top-0 left-0 w-full z-0 lg: absolute top-0 left-0 w-full z-0" src="./pattern-background-mobile.svg" alt="">
  <section class="relative z-10 flex items-center justify-center  min-h-screen px-4">
    <div class="bg-[#f5f7ff] rounded-3xl shadow-lg overflow-hidden w-full max-w-sm md:max-w-md">
      <img class="w-full h-auto rounded-t-3xl" src="./illustration-hero.svg" alt="Order Complete">
      <div >
        <p class="mt-4 text-2xl font-extrabold">Order Summary</p>
        <p class="text-[#7280a7] text-center mt-3 text-center leading-relaxed">
        You can now listen to millions of songs, audiobooks, and podcasts on any 
        device anywhere you like!
        </p>
      </div>
      
      <div class="p-4 rounded-lg mx-5 mt-4 bg-[#f5f7ff] flex items-center justify-between">
        <div class="font-semibold flex justify-between gap-4">
          <img class="" src="./icon-music.svg" alt="">
          <div class="">
          <p class="self-start font-extrabold">Annual Plan</p>
          <div class="text-[#7280a7] text-sm font-bold block self-end">$59.99/year</div>
          </div>
          <button class="ml-20 md:ml-30 text-sm text-[#3829e0] hover:text-[#4c6290] underline self-center">Change</button>
        </div>
      </div>
      <button class="bg-[#3829e0] text-white p-3 rounded-lg w-11/12 shadow-xl my-2">Proceed to Payment</button>
      <button class="place-self-center text-sm text-[#7280a7] font-black mt-3 mb-8">Cancel Order</button>
    </div>
  </section>
</body>
</html>
